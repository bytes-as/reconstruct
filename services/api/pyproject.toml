[project]
name = "landfall-api"
version = "0.1.0"
description = "Landfall API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "httpx",
  "lxml",
  "falkordb",
  "apscheduler",
  "slowapi",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
